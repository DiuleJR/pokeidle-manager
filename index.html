<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokeidle Manager</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #090d12; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      .boot-fallback { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; color: #e8f1f5; background: #090d12; font: 700 12px/1.2 'Segoe UI', sans-serif; letter-spacing: .14em; }
      .boot-fallback-mark { color: #61e3c3; font-size: 22px; }
      .boot-fallback-loader { width: 16px; height: 16px; border: 2px solid #31576a; border-top-color: #61e3c3; border-radius: 50%; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-fallback-loader { animation-duration: 2s; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback" role="status" aria-live="polite">
        <span class="boot-fallback-mark" aria-hidden="true">◉</span>
        <span>POKEIDLE MANAGER</span>
        <span class="boot-fallback-loader" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
