name: Lançamento comunitário para Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-release:
    name: Compilar instaladores Windows sem assinatura
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (stable toolchain)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --no-default-features --features community-build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features community-build
      - run: npm run tauri:build:community
      - name: Gerar somas de verificação SHA-256
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path 'src-tauri/target/release/bundle' -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe' }
          if (-not $artifacts) { throw 'Nenhum instalador MSI ou EXE foi gerado.' }
          $lines = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)"
          }
          $lines | Set-Content -LiteralPath 'SHA256SUMS.txt' -Encoding ascii
      - name: Publicar versão sem assinatura
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem -Path 'src-tauri/target/release/bundle' -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe' } | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @artifacts 'SHA256SUMS.txt' `
            --title $env:GITHUB_REF_NAME `
            --generate-notes
