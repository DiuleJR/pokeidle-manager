name: Relatar um problema
description: Relate um problema reproduzível no Pokeidle Manager.
title: '[Problema]: '
body:
  - type: markdown
    attributes:
      value: |
        Nunca envie cookies, tokens, perfis do navegador (profiles), bancos SQLite reais, sessões autenticadas, credenciais ou logs brutos com dados de autenticação. Oculte nomes de contas e outras informações pessoais.
  - type: textarea
    id: summary
    attributes:
      label: O que aconteceu?
      description: Descreva o problema com clareza.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Passos para reproduzir
      description: Liste os passos que levam ao problema.
      placeholder: |
        1. Abra...
        2. Selecione...
        3. Observe o erro...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que você esperava que acontecesse?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão do Pokeidle Manager
      placeholder: 'Ex.: 0.1.0'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Sistema operacional
      placeholder: 'Ex.: Windows 11'
    validations:
      required: true
