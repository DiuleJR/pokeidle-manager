name: Feature request
description: Suggest an improvement for Pokeidle Manager.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include cookies, tokens, browser profiles, SQLite databases, or raw logs containing authentication data.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the use case or friction you encountered.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the behavior or improvement you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional approaches or workarounds you have considered.
    validations:
      required: false
