name: Sugerir uma melhoria
description: Sugira uma melhoria para o Pokeidle Manager.
title: '[Melhoria]: '
body:
  - type: markdown
    attributes:
      value: |
        Não inclua cookies, tokens, perfis do navegador, bancos SQLite ou logs brutos com dados de autenticação.
  - type: textarea
    id: problem
    attributes:
      label: Que problema esta melhoria resolveria?
      description: Explique o caso de uso ou a dificuldade encontrada.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: O que você gostaria que acontecesse?
      description: Descreva o comportamento ou a melhoria que você imaginou.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: 'Opcional: informe outras abordagens ou soluções temporárias que você considerou.'
    validations:
      required: false
